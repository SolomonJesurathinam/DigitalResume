[theme]
base = "light"                         # Changed to light for better compatibility
primaryColor = "#667eea"               # Your gradient primary color
backgroundColor = "#f5f7fa"            # Light gradient background
textColor = "#2c3e50"                  # Dark text for readability
font = "sans serif"                    # Clean, modern look
borderColor = "#667eea"                # Match primary color
borderRadius = 0.5
linkColor = "#764ba2"                  # Secondary gradient color

[theme.sidebar]
backgroundColor = "#ffffff"            # White sidebar
textColor = "#2c3e50"                  # Dark text for sidebar
font = "sans serif"                    # Match body font
borderColor = "#667eea"                # Match primary color
borderRadius = 0.5